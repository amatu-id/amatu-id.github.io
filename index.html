<style>
:root{
  --fg:#0b0b0f;--mut:rgba(60,60,67,.78);--soft:rgba(60,60,67,.56);--line:rgba(60,60,67,.16);--bg:#eef2f7;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.8);--gline:rgba(255,255,255,.6);--shadow:0 10px 40px rgba(15,23,42,.16);
  --acc:#007aff;--accfg:#fff;--danger:#ff3b30;--ok:#34c759;--warn:#ff9500;--field:rgba(118,118,128,.12);
  --sbg:rgba(242,242,247,.94);--cell:#fff;--sep:rgba(60,60,67,.22);--wid:rgba(255,255,255,.66);--dock:rgba(255,255,255,.34);--menu:rgba(248,248,250,.86);
  --ic:72px;--dic:64px;--lf:12px;--lg:8px;--px:24px;--cols:6;--rows:5;--wmx:20px;--wmt:10px;--wmb:30px;
  color-scheme:light;
}
html[data-mode=dark]{
  --fg:#fff;--mut:rgba(235,235,245,.72);--soft:rgba(235,235,245,.5);--line:rgba(84,84,88,.5);--bg:#0b1020;
  --glass:rgba(30,30,36,.5);--glass2:rgba(44,44,50,.82);--gline:rgba(255,255,255,.12);--shadow:0 10px 40px rgba(0,0,0,.45);
  --acc:#0a84ff;--danger:#ff453a;--ok:#30d158;--warn:#ff9f0a;--field:rgba(118,118,128,.24);
  --sbg:rgba(16,16,18,.95);--cell:#1c1c1e;--sep:rgba(84,84,88,.6);--wid:rgba(30,30,34,.6);--dock:rgba(46,46,52,.4);--menu:rgba(38,38,42,.88);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;color:var(--fg);background:var(--bg);
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#wall{position:fixed;inset:0;z-index:-1;transition:background .5s}
html[data-wall=aurora] #wall{background:radial-gradient(at 12% 18%,#a5b4fc 0,transparent 48%),radial-gradient(at 88% 8%,#f9a8d4 0,transparent 42%),radial-gradient(at 72% 88%,#67e8f9 0,transparent 48%),radial-gradient(at 18% 92%,#c4b5fd 0,transparent 42%),#eef2ff}
html[data-mode=dark][data-wall=aurora] #wall{background:radial-gradient(at 12% 18%,#3730a3 0,transparent 48%),radial-gradient(at 88% 8%,#831843 0,transparent 42%),radial-gradient(at 72% 88%,#155e75 0,transparent 48%),radial-gradient(at 18% 92%,#4c1d95 0,transparent 42%),#0b1020}
html[data-wall=senja] #wall{background:radial-gradient(at 10% 10%,#fdba74 0,transparent 45%),radial-gradient(at 90% 20%,#f472b6 0,transparent 45%),radial-gradient(at 50% 100%,#a78bfa 0,transparent 55%),#fff1e6}
html[data-mode=dark][data-wall=senja] #wall{background:radial-gradient(at 10% 10%,#9a3412 0,transparent 45%),radial-gradient(at 90% 20%,#9d174d 0,transparent 45%),radial-gradient(at 50% 100%,#4c1d95 0,transparent 55%),#140b14}
html[data-wall=laut] #wall{background:radial-gradient(at 0% 0%,#7dd3fc 0,transparent 50%),radial-gradient(at 100% 40%,#5eead4 0,transparent 45%),radial-gradient(at 30% 100%,#93c5fd 0,transparent 50%),#ecfeff}
html[data-mode=dark][data-wall=laut] #wall{background:radial-gradient(at 0% 0%,#075985 0,transparent 50%),radial-gradient(at 100% 40%,#115e59 0,transparent 45%),radial-gradient(at 30% 100%,#1e3a8a 0,transparent 50%),#06121c}
html[data-wall=hutan] #wall{background:radial-gradient(at 15% 15%,#86efac 0,transparent 45%),radial-gradient(at 85% 30%,#bef264 0,transparent 40%),radial-gradient(at 50% 100%,#5eead4 0,transparent 55%),#f0fdf4}
html[data-mode=dark][data-wall=hutan] #wall{background:radial-gradient(at 15% 15%,#166534 0,transparent 45%),radial-gradient(at 85% 30%,#3f6212 0,transparent 40%),radial-gradient(at 50% 100%,#134e4a 0,transparent 55%),#07140d}
html[data-wall=grafit] #wall{background:radial-gradient(at 20% 0%,#cbd5e1 0,transparent 50%),radial-gradient(at 100% 100%,#94a3b8 0,transparent 50%),#e2e8f0}
html[data-mode=dark][data-wall=grafit] #wall{background:radial-gradient(at 20% 0%,#334155 0,transparent 50%),radial-gradient(at 100% 100%,#1e293b 0,transparent 50%),#0a0d14}
html[data-wall=polos] #wall{background:var(--bg)}
.glass{background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:var(--shadow)}
button{font:inherit;color:inherit}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--acc);color:var(--accfg);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98);opacity:.85}.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--field);color:var(--acc)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%;height:50px;font-size:17px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--gline);background:var(--glass);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ibtn svg{width:20px;height:20px}
.tbtn{border:0;background:none;color:var(--acc);font-size:17px;font-weight:600;cursor:pointer;padding:4px 2px}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:0 0 6px 4px}
.inp{width:100%;font:inherit;font-size:17px;color:var(--fg);background:var(--cell);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.card .inp{background:var(--field)}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.pw{position:relative}.pw .inp{padding-right:44px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:34px;height:34px;cursor:pointer;color:var(--soft)}
.pw button svg{width:18px;height:18px}
.err{min-height:20px;color:var(--danger);font-size:13.5px;margin:2px 0 8px}
.mut{color:var(--mut)}.soft{color:var(--soft)}
svg{display:block}

/* ---------- app icon (iOS squircle) ---------- */
.ic{width:var(--ic);height:var(--ic);flex:none;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;
  -webkit-mask:var(--sq) center/100% 100% no-repeat;mask:var(--sq) center/100% 100% no-repeat;transition:filter .15s}
.ic img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.ic svg{width:50%;height:50%}

/* ---------- gate ---------- */
.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;border-radius:28px;padding:30px 24px 22px;animation:up .45s cubic-bezier(.2,.9,.3,1)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.mark{width:54px;height:54px;background:linear-gradient(150deg,#2b3344,#0b0f18);display:flex;align-items:center;justify-content:center;flex:none;
  -webkit-mask:var(--sq) center/100% 100% no-repeat;mask:var(--sq) center/100% 100% no-repeat}
.mark svg{width:32px;height:32px}
.brand h1{margin:0;font-size:22px;letter-spacing:-.01em}.brand p{margin:1px 0 0;font-size:13px;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:10px;padding:2px;margin:0 0 18px}
.seg button{border:0;background:none;padding:7px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;color:var(--fg);transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.help{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px}
.wa{display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 9px;border-radius:999px;background:#25d366;color:#fff;text-decoration:none;font-weight:600;font-size:13.5px;flex:none}
.wa svg{width:20px;height:20px}
.req{color:var(--danger)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- lock screen (PIN) ---------- */
.lock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;color:#fff;overflow:auto;
  padding:max(26px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));animation:fade .35s}
.lock::before{content:"";position:fixed;inset:0;z-index:-1;background:rgba(8,10,20,.32);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}
.lk-top{text-align:center;margin:1vh 0 2vh;text-shadow:0 1px 12px rgba(0,0,0,.18)}
.lk-date{font-size:19px;font-weight:600;opacity:.95}
.lk-time{font:700 clamp(64px,12vh,104px)/1 "SF Pro Rounded","SF Pro Display",-apple-system,system-ui,sans-serif;letter-spacing:-.02em;margin-top:2px}
.lk-mid{display:flex;flex-direction:column;align-items:center;margin:auto 0;padding:8px 0}
.lk-who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;opacity:.9;margin-bottom:12px}
.lk-who i{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;background:linear-gradient(145deg,#8e8e93,#48484a)}
.lk-title{font-size:19px;font-weight:500}
.dots{display:flex;gap:22px;justify-content:center;margin:16px 0 4px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.6px solid #fff;transition:background .12s,transform .12s}
.dots i.on{background:#fff;transform:scale(1.06)}
.dots.shake{animation:shake .42s}
@keyframes shake{15%,55%{transform:translateX(-12px)}35%,75%{transform:translateX(12px)}}
.lock .err{color:#ffd5d2;text-align:center;font-weight:500}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;justify-content:center;margin:12px 0 6px}
.pad button{width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.17);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:background .25s}
.pad button:active{background:rgba(255,255,255,.55);transition:none}
.pad b{font-size:35px;font-weight:400;font-family:"SF Pro Display",-apple-system,system-ui,sans-serif}
.pad small{font-size:9.5px;font-weight:700;letter-spacing:.2em;margin-top:2px;padding-left:.2em}
.pad small:empty{display:none}
.pad button.t{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:16px;font-weight:500}
.lk-bot{display:flex;gap:18px}
.lk-l{border:0;background:none;color:#fff;font-size:15px;font-weight:500;cursor:pointer;padding:8px;opacity:.9}
.lk-load{margin:auto;text-align:center;font-weight:500;opacity:.92}

/* ---------- home (springboard) ---------- */
.home{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom) + 12px);transform-origin:50% 50%;user-select:none;-webkit-user-select:none}
.sbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 22px 0;font-size:14.5px;font-weight:600}
.sl{display:flex;gap:9px;align-items:baseline}.sl span{font-weight:500}
/* iPad Home Screen app: the real status bar is drawn over the page, so drop the look-alike and start below it */
@media (min-width:641px){.home{padding-top:env(safe-area-inset-top)}.sbar{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}}
@media (display-mode:standalone) and (pointer:coarse){.sbar{display:none}.home{padding-top:max(10px,env(safe-area-inset-top))}}
.sr{display:flex;gap:10px;align-items:center}
.sr svg{width:18px;height:18px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);cursor:pointer}
.sync.wait{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.sync.bad{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 25%,transparent)}
#bat{display:flex;align-items:center;gap:5px;font-size:13px}
.bt{width:25px;height:12px;border-radius:3.5px;border:1.2px solid currentColor;padding:1.2px;position:relative;opacity:.95}
.bt::after{content:"";position:absolute;right:-3.5px;top:3.2px;width:2px;height:4px;border-radius:0 1px 1px 0;background:currentColor}
.bt i{display:block;height:100%;border-radius:1.5px;background:currentColor}
#bat.low .bt i{background:var(--danger)}#bat.chg .bt i{background:var(--ok)}
.avbtn{width:28px;height:28px;border-radius:50%;border:0;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(145deg,#64d2ff,#0a84ff);cursor:pointer}
#grid{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x;padding-top:8px}
#grid::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  grid-template-rows:repeat(var(--rows),minmax(0,1fr));padding:0 var(--px);overflow:hidden}
.tile{display:flex;flex-direction:column;align-items:center;gap:var(--lg);position:relative;justify-self:center;align-self:center;width:calc(var(--ic) + 22px);
  cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none}
.icw{position:relative;filter:drop-shadow(0 3px 7px rgba(0,0,0,.16));transition:transform .28s cubic-bezier(.3,.7,.4,1.3)}
@media (hover:hover){.home:not(.drag) .tile:hover .icw{transform:translateY(-3px) scale(1.05)}}
.tile:active .ic{filter:brightness(.72)}
.lb{font-size:var(--lf);line-height:1.25;font-weight:500;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 3px color-mix(in srgb,var(--bg) 70%,transparent)}
html[data-mode=dark] .lb{text-shadow:0 1px 3px rgba(0,0,0,.5)}
html[data-nolabel] .page .lb{display:none}
.x{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(120,120,128,.82);color:#fff;
  display:none;align-items:center;justify-content:center;cursor:pointer;z-index:3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.x svg{width:11px;height:11px}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;padding:0 6px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.badge[hidden]{display:none}
.editing .tile .x{display:flex}
.editing .tile .icw{animation:jig .3s ease-in-out infinite alternate}
.editing .tile:nth-child(2n) .icw{animation-delay:-.15s;animation-direction:alternate-reverse}
.editing .tile:nth-child(3n) .icw{animation-duration:.27s}
@keyframes jig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.tile.src{opacity:0}
.editing .tile{touch-action:none}
.dragghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);transition:none;width:calc(var(--ic) + 22px)}
.dragghost .icw{animation:none!important;filter:drop-shadow(0 16px 26px rgba(0,0,0,.32))}
.dragghost .lb{display:none}

/* widgets */
.wg{margin:var(--wmt) var(--wmx) var(--wmb);border-radius:calc(var(--ic) * .36);background:var(--wid);border:1px solid var(--gline);position:relative;overflow:hidden;
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 8px 26px rgba(0,0,0,.10);container-type:size;min-width:0;min-height:0}
.wb{position:absolute;inset:0;padding:9cqh 9cqh;display:flex;flex-direction:column}
.wg.med .wb{padding:9cqh 5cqw}
.wg-clock .day{font-size:10cqh;font-weight:700;color:#ff3b30;text-transform:uppercase;letter-spacing:.02em}
.wg-clock .time{font:600 min(33cqh,29cqw)/1 "SF Pro Rounded","SF Pro Display",-apple-system,system-ui,sans-serif;letter-spacing:-.02em;margin-top:2cqh}
.wg-clock .date{font-size:10cqh;font-weight:600;margin-top:auto}
.wg-clock .hi{font-size:9cqh;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg-clock.med .wb{flex-direction:row;align-items:center;gap:6cqw}
.wg-clock.med .time{font-size:min(44cqh,19cqw);margin:0}
.wg-clock.med .side{display:flex;flex-direction:column;gap:3cqh;min-width:0}
.wg-clock.med .day{font-size:11cqh}.wg-clock.med .date{font-size:13cqh;margin:0}.wg-clock.med .hi{font-size:11cqh}
.wg-cal{cursor:pointer}
.wg-cal .mo{font-size:9.5cqh;font-weight:700;color:#ff3b30;text-transform:uppercase;margin-bottom:2cqh}
.wg-cal .cg{display:grid;grid-template-columns:repeat(7,1fr);font-size:7.6cqh;font-weight:600;text-align:center;row-gap:.6cqh;flex:1;align-content:space-between}
.wg-cal .cg i{font-style:normal;line-height:10cqh;height:10cqh;border-radius:50%;width:10cqh;margin:auto}
.wg-cal .cg i.h{color:var(--soft);font-size:6.6cqh}
.wg-cal .cg i.on{background:#ff3b30;color:#fff}
.wg-rec .wh{font-size:10cqh;font-weight:700;margin-bottom:5cqh;color:var(--mut)}
.wg-rec .rg{flex:1;display:grid;grid-template-columns:1fr 1fr;place-items:center;gap:4cqh}

  sheet(sheetHead('Ubah ikon') +
    '<div class="prev"><div id="pv">' + icon(it, '--ic:64px') + '</div><div><b id="pvn">' + esc(it.name) + '</b><div class="soft" style="font-size:13px">' + esc(it.d || '') + '</div></div></div>' +
    '<label class="field"><span>Nama</span><input class="inp" id="nm" value="' + esc(it.name) + '" maxlength="40"></label>' +
    (link ? '<label class="field"><span>Alamat (URL)</span><input class="inp" id="url" value="' + esc(link.url) + '" inputmode="url"></label>' : '') +
    (it.sys ? '' : '<div class="sec"><h3>Warna</h3><div class="sw" id="sw">' + COLORS.map((x, i) => '<button data-c="' + i + '" class="' + (!it.art && i === it.c ? 'on' : '') + '" style="background:' + grad(i) + '" aria-label="Warna ' + (i + 1) + '"></button>').join('') + '</div></div>' +
    '<div class="sec"><h3>Simbol</h3><div class="icg" id="icg">' + ICON_CHOICES.map(n => '<button data-i="' + n + '" class="' + (!it.art && n === it.icon ? 'on' : '') + '">' + svg(n) + '</button>').join('') + '</div></div>') +
    '<div class="sec"><div class="grp"><div class="row np"><span>Tampilkan di Dock</span><label class="switch"><input type="checkbox" id="dk"' + (P.dock.includes(id) ? ' checked' : '') + '><i></i></label></div></div></div>' +
    '<div class="btns"><button class="btn" id="op">Buka</button>' +
    (link ? '<button class="btn danger" id="rm">Hapus pintasan</button>' : (it.sys ? '' : '<button class="btn ghost" id="hd">Sembunyikan</button>') + '<button class="btn ghost" id="rs">Bawaan</button>') + '</div>', el => {
    const upd = () => {
      const m = items()[id];
      $('#pv', el).innerHTML = icon(m, '--ic:64px'); $('#pvn', el).textContent = m.name;
      renderTiles();
    };
    const put = (k, v) => {
      if (link) link[k] = v; else {
        c[k] = v;
        if (k === 'c' && c.icon == null) c.icon = items()[id].icon;    // a colour or symbol turns the artwork into a glyph icon
        if (k === 'icon' && c.c == null) c.c = items()[id].c;
        P.custom[id] = c;
      }
      save(); upd();
    };
    $('#nm', el).oninput = e => put('name', e.target.value.trim());
    if (link) $('#url', el).onchange = e => { link.url = fixUrl(e.target.value); e.target.value = link.url; save(); };
    if (!it.sys) {
      $('#sw', el).onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; $$('#sw button', el).forEach(x => x.classList.toggle('on', x === b)); put('c', +b.dataset.c); };
      $('#icg', el).onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; $$('#icg button', el).forEach(x => x.classList.toggle('on', x === b)); put('icon', b.dataset.i); };
    }
    $('#dk', el).onchange = e => {
      if (e.target.checked && P.dock.length >= 7) { e.target.checked = false; toast('Dock maksimal 7 ikon.'); return; }
      P.dock = e.target.checked ? [...new Set([...P.dock, id])] : P.dock.filter(x => x !== id); save(); renderTiles();
    };
    $('#op', el).onclick = () => { closeSheet(); setEdit(false); setTimeout(() => openItem(id, findIc(id)), 260); };
    if (link) $('#rm', el).onclick = () => { removeLink(id); closeSheet(); };
    else {
      if (!it.sys) $('#hd', el).onclick = () => { closeSheet(); hideItem(id); };
      $('#rs', el).onclick = () => { delete P.custom[id]; save(); closeSheet(); renderTiles(); };
    }
  });
}
function fixUrl(u) { u = (u || '').trim(); if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u; return u; }
function linkEditor() {
  sheet(sheetHead('Tambah pintasan') + '<form id="lf"><label class="field"><span>Nama</span><input class="inp" id="ln" maxlength="40" required></label>' +
    '<label class="field"><span>Alamat (URL)</span><input class="inp" id="lu" inputmode="url" placeholder="https://" required></label><div class="err" id="le"></div><button class="btn block">Tambah</button></form>', el => {
    $('#ln', el).focus();
    $('#lf', el).onsubmit = e => {
      e.preventDefault();
      const name = $('#ln', el).value.trim(), url = fixUrl($('#lu', el).value);
      if (!name || !/^https?:\/\/[^\s.]+\.[^\s]+/.test(url)) { $('#le', el).textContent = 'Isi nama dan alamat yang benar.'; return; }
      const id = 'l-' + Date.now().toString(36);
      P.links = (P.links || []).concat({ id, name, url, icon: 'link', c: 14 }); P.order = order().concat(id).filter((x, i, a) => a.indexOf(x) === i);
      save(); closeSheet(); renderTiles();
    };
  });
}

// ---------- settings (iOS grouped list) ----------
const opts = (key, list) => '<div class="opts' + (list.length > 4 ? ' wide' : '') + '" data-k="' + key + '">' + list.map(([v, l]) => '<button class="opt' + (String(P[key]) === String(v) ? ' on' : '') + '" data-v="' + v + '">' + l + '</button>').join('') + '</div>';
const ri = (c, n) => '<span class="ri" style="background:' + c + '">' + svg(n, 2.1) + '</span>';
const row = (ic, label, right) => '<div class="row"><span class="rl">' + ic + '<span>' + label + '</span></span>' + right + '</div>';
const brow = (id, ic, label, extra) => '<button class="row" id="' + id + '"><span class="rl">' + ic + '<span>' + label + '</span></span><span class="chev">' + (extra || '') + svg('chev', 2.4) + '</span></button>';
function settings() {
  const s = A.sess(), m = items();
  const hidden = P.hidden.filter(id => m[id] && id !== 'settings');
  sheet(sheetHead('Pengaturan') +
    '<div class="acct"><div class="av">' + esc(s.u[0].toUpperCase()) + '</div><div style="min-width:0"><b>' + esc(s.u) + '</b><div class="soft">Akun AMATU · semua aplikasi tersinkron</div></div></div>' +
    '<div class="sec"><h3>Tampilan</h3><div class="grp">' +
    row(ri('#0a84ff', 'moon'), 'Mode', opts('mode', [['auto', 'Otomatis'], ['light', 'Terang'], ['dark', 'Gelap']])) +
    row(ri('#5e5ce6', 'apps'), 'Ukuran ikon', opts('size', [['s', 'Kecil'], ['m', 'Sedang'], ['l', 'Besar']])) +
    row(ri('#ff9f0a', 'text'), 'Nama di bawah ikon', '<label class="switch"><input type="checkbox" id="lab"' + (P.labels ? ' checked' : '') + '><i></i></label>') +
    row(ri('#32ade6', 'image'), 'Wallpaper', '') +
    '<div class="walls" id="walls">' + WALLS.map(([v, l]) => '<button class="wl' + (P.wall === v ? ' on' : '') + '" data-w="' + v + '" title="' + l + '" aria-label="' + l + '"></button>').join('') + '</div></div></div>' +
    '<div class="sec"><h3>Layar Utama</h3><div class="grp">' +
    brow('ehome', ri('#34c759', 'edit'), 'Edit Layar Utama') + brow('addl', ri('#007aff', 'link'), 'Tambah Pintasan') + brow('reset', ri('#8e8e93', 'refresh'), 'Atur Ulang Tata Letak') + '</div></div>' +
    '<div class="sec"><h3>Keamanan</h3><div class="grp">' +
    row(ri('#ff3b30', 'lock'), 'Kunci otomatis', opts('idle', [[5, '5 mnt'], [15, '15 mnt'], [30, '30 mnt'], [60, '1 jam'], [0, 'Tidak pernah']])) +
    brow('cpin', ri('#ff9500', 'key'), 'Ganti PIN') + brow('cpass', ri('#8e8e93', 'key'), 'Ganti Password') + brow('lk', ri('#5856d6', 'lock'), 'Kunci Sekarang') + '</div></div>' +
    (hidden.length ? '<div class="sec"><h3>Disembunyikan</h3><div class="grp">' + hidden.map(id => '<div class="row"><span class="rl">' + icon(m[id], '--ic:30px') + '<span>' + esc(m[id].name) + '</span></span><button class="tbtn" style="font-size:15px" data-show="' + esc(id) + '">Tampilkan</button></div>').join('') + '</div></div>' : '') +
    '<div class="sec"><h3>Sinkronisasi</h3><div class="grp">' + brow('syn', ri('#34c759', 'refresh'), '<span id="syt" class="mut" style="font-size:14px">…</span>', 'Sinkron') + '</div></div>' +
    '<div class="sec"><h3>Penyimpanan Google Drive</h3><div class="grp" id="drv"><div class="dsum soft">Memuat…</div></div></div>' +
    '<div class="sec"><div class="grp"><a class="row" href="' + WA + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;padding:8px 14px"><span class="rl"><span class="ri" style="background:#25d366">' + WA_SVG + '</span><span>Hubungi Admin</span></span><span class="chev">' + svg('chev', 2.4) + '</span></a></div></div>' +
    '<div class="sec"><div class="grp"><button class="row red" id="out">Keluar</button></div></div>', el => {
    $$('.wl', el).forEach(b => { b.style.background = wallBg(b.dataset.w); });
    $$('.opts', el).forEach(g => g.onclick = e => {
      const b = e.target.closest('.opt'); if (!b) return;
      const k = g.dataset.k; P[k] = k === 'idle' ? +b.dataset.v : b.dataset.v;
      $$('.opt', g).forEach(x => x.classList.toggle('on', x === b));
      if (k === 'idle') A.touch();
      save(); theme(); if (k === 'size') relayout();
    });
    $('#lab', el).onchange = e => { P.labels = e.target.checked; save(); theme(); relayout(); };
    $('#walls', el).onclick = e => { const b = e.target.closest('[data-w]'); if (!b) return; P.wall = b.dataset.w; $$('.wl', el).forEach(x => x.classList.toggle('on', x === b)); save(); theme(); };
    $$('[data-show]', el).forEach(b => b.onclick = () => { P.hidden = P.hidden.filter(x => x !== b.dataset.show); save(); renderTiles(); settings(); });
    $('#ehome', el).onclick = () => { closeSheet(); setEdit(true); };
    $('#addl', el).onclick = linkEditor;
    $('#reset', el).onclick = () => { if (!confirm('Kembalikan urutan, nama, warna, dan Dock ke bawaan?')) return; const d = DEF(); Object.assign(P, { order: d.order, hidden: [], custom: {}, dock: d.dock }); save(); renderTiles(); settings(); };
    $('#cpin', el).onclick = changePin;
    $('#cpass', el).onclick = changePass;
    $('#lk', el).onclick = lockNow;
    $('#syn', el).onclick = async () => { $('#syt', el).textContent = 'Menyinkronkan…'; try { await A.flush(); const r = await A.pull(); if (r.changed) refresh(); loadStat(); } catch (e) { toast(errText(e)); } syncText(el); };
    $('#out', el).onclick = logout;
    syncText(el);
    driveUsage(el);
  });
}
const fmtN = (x, d) => String(+x.toFixed(d)).replace('.', ',');
const fmtB = b => b >= 1073741824 ? fmtN(b / 1073741824, 2) + ' GB' : b >= 1048576 ? fmtN(b / 1048576, b >= 104857600 ? 0 : 1) + ' MB' : Math.max(0, Math.round(b / 1024)) + ' KB';
const dbar = (used, cap) => { const p = cap ? Math.min(100, used / cap * 100) : 0; return '<div class="dbar"><i class="' + (p >= 95 ? 'f' : p >= 80 ? 'w' : '') + '" style="width:' + p.toFixed(1) + '%"></i></div>'; };
// Drive of the Portal: one 10 GB pool for all apps; per-app rows = share of what is used (everybody / this account).
async function driveUsage(el) {
  const box = $('#drv', el); if (!box) return;
  try {
    const u = await A.usage(), cap = u.total_mb * 1048576, on = u.drive && u.drive.on;
    box.innerHTML = '<div class="dsum"><div class="rl">' + ri(on ? '#0a84ff' : '#8e8e93', 'cloud') + '<div style="min-width:0"><b>' + fmtB(u.used) + ' dari ' + fmtB(cap) + ' terpakai</b>' +
      '<div class="soft">' + (on ? esc(u.drive.email) + ' · folder "AMATU Portal"' : 'Belum tersambung') + '</div></div></div>' + dbar(u.used, cap) +
      '<div class="soft" style="margin-top:8px">Data kecil (≤ 2 KB) akun ini: ' + fmtB(u.inline) + ' dari ' + fmtB(u.inline_max) + '</div></div>' +
      '<div class="dsum soft" style="font-size:13px">Satu kolam bersama untuk semua aplikasi, tanpa jatah per aplikasi.</div>' +
      (u.apps || []).filter(a => a.used > 0).map(a => '<div class="dapp"><div><span>' + esc(a.name) + '</span><span class="soft">' + fmtB(a.used) + (a.me ? ' · Anda ' + fmtB(a.me) : '') + '</span></div>' + dbar(a.used, u.used) + '</div>').join('');
  } catch (e) { box.innerHTML = '<div class="dsum soft">' + esc(errText(e)) + '</div>'; }
}
function wallBg(w) {
  const r = document.documentElement, prev = r.dataset.wall;
  r.dataset.wall = w;
  const bg = getComputedStyle($('#wall')).background;
  r.dataset.wall = prev;
  return bg;
}
async function syncText(el) {
  const t = $('#syt', el); if (!t) return;
  const n = A.pending(), last = A.synced(), big = Object.keys(A.big()).length;
  let line = (n ? n + ' perubahan menunggu' : 'Tersinkron') + (last ? ' · ' + ago(last) : '');
  try { const st = await A.rpc('amt_status', { p_token: A.sess().t }); line += ' · ' + st.items + ' item, ' + (st.bytes / 1048576).toFixed(1) + ' MB'; } catch { }
  if (big) line += ' · ' + big + ' item > 25 MB hanya di perangkat ini';
  t.textContent = line;
}
function syncSheet() { settings(); setTimeout(() => $('#syt')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 80); }
function changePin() {
  const s = A.sess();
  sheet(sheetHead('Ganti PIN') + '<form id="cp">' +
    '<label class="field"><span>PIN lama</span><input class="inp" id="o" inputmode="numeric" maxlength="4" pattern="[0-9]*" type="password" autocomplete="off"></label>' +
    '<label class="field"><span>PIN baru (4 angka)</span><input class="inp" id="n1" inputmode="numeric" maxlength="4" pattern="[0-9]*" type="password" autocomplete="off"></label>' +
    '<label class="field"><span>Ulangi PIN baru</span><input class="inp" id="n2" inputmode="numeric" maxlength="4" pattern="[0-9]*" type="password" autocomplete="off"></label>' +
    '<div class="err" id="ce"></div><button class="btn block">Simpan PIN</button></form>', el => {
    $('#o', el).focus();
    $('#cp', el).onsubmit = async e => {
      e.preventDefault();
      const n1 = $('#n1', el).value, ce = $('#ce', el);
      if (!/^[0-9]{4}$/.test(n1)) { ce.textContent = ERR.pinfmt; return; }
      if (n1 !== $('#n2', el).value) { ce.textContent = 'Ulangi PIN belum sama.'; return; }
      try { await A.rpc('amt_pin_change', { p_token: s.t, p_old: $('#o', el).value, p_new: n1 }); closeSheet(); toast('PIN diganti.'); }
      catch (ex) { ce.textContent = errText(ex); }
    };
  });
}
function changePass() {
  const s = A.sess();
  sheet(sheetHead('Ganti password') + '<form id="cw">' + pwField('o', 'Password lama', 'current-password') + pwField('n1', 'Password baru', 'new-password') + pwField('n2', 'Ulangi password baru', 'new-password') +
    '<p class="soft" style="font-size:13px;margin:-4px 0 10px">Perangkat lain yang masuk dengan akun ini akan keluar.</p><div class="err" id="ce"></div><button class="btn block">Simpan password</button></form>', el => {
    eyes(el); $('#o', el).focus();
    $('#cw', el).onsubmit = async e => {
      e.preventDefault();
      const n1 = $('#n1', el).value, ce = $('#ce', el);
      if (n1.length < 6) { ce.textContent = ERR.pass; return; }
      if (n1 !== $('#n2', el).value) { ce.textContent = 'Ulangi password belum sama.'; return; }
      try { await A.rpc('amt_pass', { p_token: s.t, p_old: $('#o', el).value, p_new: n1 }); closeSheet(); toast('Password diganti.'); }
      catch (ex) { ce.textContent = errText(ex); }
    };
  });
}
async function logout() {
  const b = $('#out'); if (b) { b.disabled = true; b.textContent = 'Menyimpan…'; }
  try { await A.leave(); }
  catch (e) {
    if (!confirm('Sebagian perubahan belum tersimpan ke cloud (' + errText(e) + '). Tetap keluar dan hapus dari perangkat ini?')) { if (b) { b.disabled = false; b.textContent = 'Keluar'; } return; }
    await A.leave({ force: true });
  }
  closeSheet(); P = DEF(); theme(); gateMsg = ''; gate();
}

// ---------- live updates ----------
A.on(kind => {
  if (!A.unlocked() || !$('#grid')) return;
  if (kind === 'remote') A.pull().then(r => r.changed && refresh()).catch(() => { });
  else refresh();
});
addEventListener('storage', e => { if (e.key === 'amatu.portal' && $('#grid')) refresh(); });
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, () => A.unlocked() && A.touch(), { passive: true, capture: true }));
addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { A.flush().catch(() => { }); return; }
  if ($('#grid') && !A.unlocked()) lockNow();
  else if ($('#grid')) A.pull().then(r => r.changed && refresh()).catch(() => { });
});

// ---------- boot ----------
async function boot() {
  theme();
  const s = A.sess();
  if (!s) return gate();
  if (A.unlocked()) {
    const n = nextUrl(); if (n) { location.replace(n); return; }
    A.rtStart(); return home();
  }
  const knew = A.lget('pt.haspin') === s.u;
  if (knew) pinView('enter');
  try {
    const st = await A.rpc('amt_status', { p_token: s.t });
    if (st.has_pin) A.lset('pt.haspin', s.u); else A.ldel('pt.haspin');
    if (!knew || !st.has_pin) pinView(st.has_pin ? 'enter' : 'create');
  } catch (e) {
    if (e.code === 'auth') { A.ldel('pt.sess'); A.ldel('pt.haspin'); return gate(); }
    if (!knew) pinView('enter');
    setTimeout(() => { const er = $('#err'); if (er && !er.textContent) er.textContent = errText(e); }, 0);
  }
}
boot();
</script>
</body>
</html>
