function order() {
  const m = items(), seen = new Set(), out = [];
  for (const id of P.order || []) if (m[id] && !seen.has(id)) { seen.add(id); out.push(id); }

}

        '<label class="field"><span>Kode referral <b class="req">*</b></span><input class="inp" id="ref" autocomplete="off" autocapitalize="none" spellcheck="false" required placeholder="Wajib diisi"></label>') +
    '<div class="err" id="err">' + esc(gateMsg) + '</div>' +

    '<div class="help"><span class="mut">Belum punya akses? Hubungi admin.</span><a class="wa" href="' + WA + '" target="_blank" rel="noopener">' + WA_SVG + 'Admin</a></div>' +
    '</div></div>';
  gateMsg = '';

  eyes(app);
  const old = A.sess(); if (old && old.u) $('#u').value = old.u;
  ($('#u').value ? $('#p') : $('#u')).focus();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const err = $('#err'), go = $('#go'), u = $('#u').value.trim().toLowerCase(), p = $('#p').value;
    err.textContent = '';
    if (!u || !p) { err.textContent = 'Isi username dan password.'; return; }
    if (mode === 'reg') {
      if (!/^[a-z0-9._-]{3,32}$/.test(u)) { err.textContent = ERR.user; return; }
      if (p.length < 6) { err.textContent = ERR.pass; return; }
      if (p !== $('#p2').value) { err.textContent = 'Ulangi password belum sama.'; return; }
      if (!$('#ref').value.trim()) { err.textContent = 'Kode referral wajib diisi.'; $('#ref').focus(); return; }
    }
    go.disabled = true; go.textContent = 'Memproses…';
    try {
      const r = mode === 'login' ? await A.rpc('amt_login', { p_user: u, p_pass: p })
        : await A.rpc('amt_register', { p_user: u, p_pass: p, p_ref: $('#ref').value.trim() });
      if (r.error) throw r;
      if (!(await saveOldAccount(r.user))) { go.disabled = false; go.textContent = mode === 'login' ? 'Masuk' : 'Daftar'; return; }
      A.setSess({ u: r.user, t: r.token, c: r.chan });
      pinView(r.has_pin ? 'enter' : 'create');
    } catch (ex) {
      err.textContent = errText(ex);
      go.disabled = false; go.textContent = mode === 'login' ? 'Masuk' : 'Daftar';
    }
  };
}
// Another account's unsent changes on this device are pushed before it is cleared for the new account.
async function saveOldAccount(newUser) {
  const own = A.owner();
  if (!own || own === newUser || !A.pending()) return true;
  try { const s = A.sess(); if (s && s.u === own) { await A.flush(); if (!A.pending()) return true; } } catch { }
  return confirm('Perubahan akun "' + own + '" di perangkat ini belum tersimpan ke cloud dan akan hilang. Lanjut masuk sebagai "' + newUser + '"?');
}

// ---------- pin ----------
function pinView(mode, first) {
  stopHome();
  const s = A.sess(); if (!s) return gate();
  const title = { enter: 'Masukkan PIN', create: 'Buat PIN 4 angka', confirm: 'Ulangi PIN' }[mode];
  app.innerHTML = '<div class="center"><div class="card glass pincard">' +
    '<div class="av">' + esc(s.u[0].toUpperCase()) + '</div><div style="font-weight:600">' + esc(s.u) + '</div>' +
    '<div class="mut" style="font-size:14px;margin-top:10px">' + title + '</div>' +
    '<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="err" id="err" style="margin:6px 0 0"></div>' +
    '<div class="pad" id="pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => '<button data-n="' + n + '">' + n + '</button>').join('') +
    (mode === 'enter' ? '<button class="t" data-a="forgot">Lupa?</button>' : '<button class="t" data-a="none"></button>') +
    '<button data-n="0">0</button><button class="t" data-a="del" aria-label="Hapus">' + svg('back', 1.7) + '</button></div>' +
    '<button class="linkbtn" id="sw">Ganti akun</button></div></div>';
  let pin = '', busy = false;
  const dots = $('#dots'), err = $('#err');
  const paint = () => $$('i', dots).forEach((d, i) => d.classList.toggle('on', i < pin.length));
  const fail = msg => { err.textContent = msg; dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); pin = ''; paint(); };
  async function done() {
    if (mode === 'create') return pinView('confirm', pin);
    if (mode === 'confirm' && pin !== first) { pinView('create'); setTimeout(() => { const e = $('#err'); if (e) e.textContent = 'PIN tidak sama, ulangi.'; }, 0); return; }
    busy = true;
    try {
      const r = await A.rpc('amt_pin', { p_token: s.t, p_pin: pin });
      if (r.locked) { A.ldel('pt.sess'); gateMsg = 'PIN salah 5 kali. Semua perangkat keluar, silakan masuk lagi.'; return gate(); }
      if (!r.ok) { busy = false; return fail('PIN salah. Sisa ' + r.left + ' percobaan.'); }
      await openAccount(s.u);
    } catch (e) {
      busy = false;
      if (e.code === 'auth') { A.ldel('pt.sess'); gateMsg = ERR.auth; return gate(); }
      fail(errText(e));
    }
  }
  const press = n => { if (busy || pin.length >= 4) return; err.textContent = ''; pin += n; paint(); if (pin.length === 4) setTimeout(done, 120); };
  const del = () => { if (busy) return; pin = pin.slice(0, -1); paint(); };
  $('#pad').onclick = e => {

function startDrag(e) {

    $('#walls', el).onclick = e => { const b = e.target.closest('[data-w]'); if (!b) return; P.wall = b.dataset.w; $$('.wl', el).forEach(x => x.classList.toggle('on', x === b)); save(); theme(); };
    $$('[data-show]', el).forEach(b => b.onclick = () => { P.hidden = P.hidden.filter(x => x !== b.dataset.show); save(); renderTiles(); settings(); });
    $('#reset', el).onclick = () => { if (!confirm('Kembalikan urutan, nama, warna, dan Dock ke bawaan?')) return; const d = DEF(); Object.assign(P, { order: d.order, hidden: [], custom: {}, dock: d.dock }); save(); renderTiles(); settings(); };
    $('#cpin', el).onclick = changePin;
    $('#cpass', el).onclick = changePass;
    $('#lk', el).onclick = lockNow;
    $('#syn', el).onclick = async () => { $('#syt', el).textContent = 'Menyinkronkan…'; try { await A.flush(); const r = await A.pull(); if (r.changed) refresh(); } catch (e) { toast(errText(e)); } syncText(el); };
    $('#out', el).onclick = logout;
    syncText(el);
  });
}
function wallBg(w) {
  const r = document.documentElement, prev = r.dataset.wall;
  r.dataset.wall = w;
  const bg = getComputedStyle($('#wall')).background;
  r.dataset.wall = prev;
  return bg;
}
async function syncText(el) {
  const t = $('#syt', el); if (!t) return;
  const n = A.pending(), last = A.synced(), big = Object.keys(A.big()).length;
  let line = (n ? n + ' perubahan menunggu' : 'Tersinkron') + (last ? ' · ' + ago(last) : '');
  try { const st = await A.rpc('amt_status', { p_token: A.sess().t }); line += ' · ' + st.items + ' item, ' + (st.bytes / 1048576).toFixed(1) + ' MB'; } catch { }
  if (big) line += ' · ' + big + ' item > 4,8 MB hanya di perangkat ini';
  t.textContent = line;
}
function syncSheet() { settings(); setTimeout(() => $('#syt')?.scrollIntoView({ block: 'center' }), 50); }
function changePin() {
  const s = A.sess();
  sheet(sheetHead('Ganti PIN') + '<form id="cp">' +
    '<label class="field"><span>PIN lama</span><input class="inp" id="o" inputmode="numeric" maxlength="4" pattern="[0-9]*" type="password" autocomplete="off"></label>' +
    '<label class="field"><span>PIN baru (4 angka)</span><input class="inp" id="n1" inputmode="numeric" maxlength="4" pattern="[0-9]*" type="password" autocomplete="off"></label>' +
    '<label class="field"><span>Ulangi PIN baru</span><input class="inp" id="n2" inputmode="numeric" maxlength="4" pattern="[0-9]*" type="password" autocomplete="off"></label>' +
    '<div class="err" id="ce"></div><button class="btn block">Simpan PIN</button></form>', el => {
    $('#o', el).focus();
    $('#cp', el).onsubmit = async e => {
      e.preventDefault();
      const n1 = $('#n1', el).value, ce = $('#ce', el);
      if (!/^[0-9]{4}$/.test(n1)) { ce.textContent = ERR.pinfmt; return; }
      if (n1 !== $('#n2', el).value) { ce.textContent = 'Ulangi PIN belum sama.'; return; }
      try { await A.rpc('amt_pin_change', { p_token: s.t, p_old: $('#o', el).value, p_new: n1 }); closeSheet(); toast('PIN diganti.'); }
      catch (ex) { ce.textContent = errText(ex); }
    };
  });
}
function changePass() {
  const s = A.sess();
  sheet(sheetHead('Ganti password') + '<form id="cw">' + pwField('o', 'Password lama', 'current-password') + pwField('n1', 'Password baru', 'new-password') + pwField('n2', 'Ulangi password baru', 'new-password') +
    '<p class="soft" style="font-size:13px;margin:-4px 0 10px">Perangkat lain yang masuk dengan akun ini akan keluar.</p><div class="err" id="ce"></div><button class="btn block">Simpan password</button></form>', el => {
    eyes(el); $('#o', el).focus();
    $('#cw', el).onsubmit = async e => {
      e.preventDefault();
      const n1 = $('#n1', el).value, ce = $('#ce', el);
      if (n1.length < 6) { ce.textContent = ERR.pass; return; }
      if (n1 !== $('#n2', el).value) { ce.textContent = 'Ulangi password belum sama.'; return; }
      try { await A.rpc('amt_pass', { p_token: s.t, p_old: $('#o', el).value, p_new: n1 }); closeSheet(); toast('Password diganti.'); }
      catch (ex) { ce.textContent = errText(ex); }
    };
  });
}
async function logout() {
  const b = $('#out'); if (b) { b.disabled = true; b.textContent = 'Menyimpan…'; }
  try { await A.leave(); }
  catch (e) {
    if (!confirm('Sebagian perubahan belum tersimpan ke cloud (' + errText(e) + '). Tetap keluar dan hapus dari perangkat ini?')) { if (b) { b.disabled = false; b.textContent = 'Keluar'; } return; }
    await A.leave({ force: true });
  }
  closeSheet(); P = DEF(); theme(); gateMsg = ''; gate();
}

// ---------- live updates ----------
A.on(kind => {
  if (!A.unlocked() || !$('#grid')) return;
  if (kind === 'remote') A.pull().then(r => r.changed && refresh()).catch(() => { });
  else refresh();
});
addEventListener('storage', e => { if (e.key === 'amatu.portal' && $('#grid')) refresh(); });
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, () => A.unlocked() && A.touch(), { passive: true, capture: true }));
addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { A.flush().catch(() => { }); return; }
  if ($('#grid') && !A.unlocked()) lockNow();
  else if ($('#grid')) A.pull().then(r => r.changed && refresh()).catch(() => { });
});

// ---------- boot ----------
async function boot() {
  theme();
  const s = A.sess();
  if (!s) return gate();
  if (A.unlocked()) {
    const n = nextUrl(); if (n) { location.replace(n); return; }
    A.rtStart(); return home();
  }
  try {
    const st = await A.rpc('amt_status', { p_token: s.t });
    pinView(st.has_pin ? 'enter' : 'create');
  } catch (e) {
    if (e.code === 'auth') { A.ldel('pt.sess'); return gate(); }
    pinView('enter');
    setTimeout(() => { const er = $('#err'); if (er) er.textContent = errText(e); }, 0);
  }
}
boot();
</script>
</body>
</html>
